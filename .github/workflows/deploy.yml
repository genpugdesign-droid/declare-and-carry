name: Deploy to GitHub Pages

# Manual only for now: the repo is private, and GitHub Pages needs a paid plan
# for private repos. Once hosting is chosen, restore the automatic triggers:
#   push: { branches: [main] }
#   schedule: [{ cron: "0 14 * * 1" }]   # weekly rebuild keeps dated badges honest
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Serve from /<repo> until a custom domain is set (then add a CNAME file
      # to public/ and set this variable to an empty string in repo settings).
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
